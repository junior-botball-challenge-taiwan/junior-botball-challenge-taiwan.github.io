<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">  <!-- 11/7：只給教練用的隱藏頁，不讓搜尋引擎收錄 -->
<title>JBC 台中站座位查詢</title>
<style>
:root{--bg:#F4F6F8;--panel:#fff;--ink:#1F2D3D;--muted:#5F6B78;--line:#D5DBE1;--hi:#E53935;--head:#1F3864}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--head);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header h1{font-size:17px;margin:0;font-weight:700}
header .sub{font-size:12px;opacity:.85}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:#fff;padding:6px 14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--head);font-weight:700}
main{display:flex;height:calc(100% - 56px)}
#stage{flex:1;position:relative;overflow:hidden;background:#E6EAEE;touch-action:none}
#svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;font-size:22px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.zoom button.fit{font-size:12px}
#tip{position:absolute;left:10px;bottom:10px;right:64px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;display:none}
aside{width:340px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px;font-size:15px}
aside h2{font-size:15px;margin:4px 0 8px}
#q{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.u{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.u:hover{background:#F1F4F7}
.u.on{background:#FFEBEE;border-color:#F5B7B5}
.u .n{margin-left:auto;color:var(--muted);font-size:13px;flex:none}
#mine{margin:8px 0 14px;padding:10px;border-radius:10px;background:#FFF5F5;border:1px solid #F5B7B5;display:none}
#mine h3{margin:0 0 6px;font-size:15px;color:var(--hi)}
#mine .t{padding:6px 4px;border-top:1px dashed #F0C9C8;cursor:pointer;font-size:14px}
#mine .t:first-of-type{border-top:0}
#mine .t b{color:var(--ink)}
#mine .t span{color:var(--muted);font-size:13px;display:block}
.hint{color:var(--muted);font-size:13px;margin:6px 0 10px}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:10px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:3px}
@media (max-width:820px){
  main{flex-direction:column;height:auto}
  #stage{height:62vh;flex:none}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  .seg{margin-left:0}
}
</style>
</head>
<body>
<header>
  <div><h1>JBC 開放挑戰台中站 2026/12/13　座位查詢</h1><div class="sub">葳格國際會議中心　維多利亞廳</div></div>
  <div class="seg" id="sess"></div>
</header>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zfit" class="fit">全場</button></div>
    <div id="tip"></div>
  </div>
  <aside>
    <h2>1. 選場次（上方）　2. 點你的單位</h2>
    <div class="hint">點單位後，全場地圖上紅色的桌子就是你的隊伍；雙指或滾輪可以放大看隊名，點桌子看詳細資料。</div>
    <div class="hint" style="color:#1F3864;background:#EEF3FA;border-radius:8px;padding:8px 10px">座位安排說明：主辦單位已盡最大努力，讓同一單位的隊伍盡量坐在一起，使各單位教練照顧隊伍的移動距離最短。排序規則如下：<br>① 先依組別順序排，同一組別內再依單位集中排列。<br>② 一張地圖左右兩側的兩隊，盡量安排同一單位，使用同一張場地。<br>③ 一位裁判負責上下兩張地圖（共 4 個桌位），而且只判同一個組別；同單位的其他隊伍盡量排在同一裁判區或相鄰桌位。</div>
    <div id="mine"></div>
    <input id="q" placeholder="搜尋單位、隊名或隊伍編號">
    <div id="units"></div>
    <div class="lg" id="lg"></div>
  </aside>
</main>

      const fill = mine ? '#E53935' : dim ? '#E3E7EB' : (D.gcolor[t.g] || '#607D8B');
      const ink = dim ? '#8A96A3' : '#fff';
      const cx = x0 + w / 2, cy = y0 + hh / 2, along = vert ? hh : w, across = vert ? w : hh;
      const fs1 = Math.min(0.15, across * 0.3), fs2 = Math.min(0.11, across * 0.22);
      const rot = vert ? `transform="rotate(-90 ${cx} ${cy})"` : '';
      const nm = t.n.length > 14 ? t.n.slice(0, 13) + '…' : t.n;
      h += `<g class="chip" data-c="${esc(c)}" style="cursor:pointer"><rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="${fill}" stroke="${pk ? '#111' : mine ? '#7F0000' : '#9AA5B1'}" stroke-width="${pk ? 0.08 : 0.02}"/>` +
        `<text font-weight="700" text-anchor="middle" fill="${ink}" ${rot}><tspan x="${cx}" y="${cy}" dy="-0.2em" font-size="${fs1}">${esc(c)}</tspan>` +
        `<tspan x="${cx}" y="${cy}" dy="1.05em" font-size="${fs2}" textLength="${along * 0.92}" lengthAdjust="spacingAndGlyphs">${esc(nm)}</tspan></text></g>`;
    });
  }
  svg.innerHTML = h;
  panel();
}

// ---------- 右側 ----------
function panel() {
  document.querySelectorAll('#sess button').forEach(b => b.classList.toggle('on', b.dataset.s === cur));
  const cnt = {};
  for (const k in D.assign[cur]) for (const c of D.assign[cur][k]) cnt[T[c].u] = (cnt[T[c].u] || 0) + 1;
  const ql = q.trim().toLowerCase();
  const hitU = ql ? new Set(Object.values(T).filter(t => (t.u + t.n + t.c + (SH[t.u] || '')).toLowerCase().includes(ql)).map(t => t.u)) : null;
  $('units').innerHTML = D.units.filter(u => cnt[u.u] && (!hitU || hitU.has(u.u)))
    .map(u => `<div class="u${sel === u.u ? ' on' : ''}" data-u="${esc(u.u)}"><span>${esc(u.u)}</span><span class="n">本場 ${cnt[u.u]} 隊</span></div>`).join('')
    || '<div class="hint">這個場次沒有符合的單位，試試切換上午／下午。</div>';
  $('units').querySelectorAll('.u').forEach(el => el.onclick = () => pickUnit(el.dataset.u));
  $('mine').style.display = 'none';   // 11/7 理事長：點單位後的「隊伍資訊」清單卡片拿掉，只在地圖上亮出位置（點桌子仍可看隊名）
  const gs = [...new Set(Object.values(T).filter(t => t.s === cur).map(t => t.g))];
  $('lg').innerHTML = (sel ? '<span><i style="background:#E53935"></i>你選的單位</span>' : '') + gs.map(g => `<span><i style="background:${sel ? '#E3E7EB' : D.gcolor[g]}"></i>${esc(g)}</span>`).join('');
}
function pickUnit(u) {
  sel = sel === u ? null : u; picked = null; $('tip').style.display = 'none';
  fit(); render();   // 11/7 理事長：點單位後維持全場地圖，教練一眼看到自己隊伍在全場的相對位置
}
function tap(c) {
  picked = c; const tip = $('tip');
  if (c) {
    const t = T[c];
    tip.innerHTML = `<b>${esc(c)}</b>　${esc(t.n)}<br>${esc(t.u)}｜${esc(t.g)}｜${esc(t.loc)}`; tip.style.display = 'block';
  } else tip.style.display = 'none';
  render();
}
$('sess').innerHTML = D.sessions.map(s => `<button data-s="${s}">${s}場</button>`).join('');
$('sess').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.s; picked = null; $('tip').style.display = 'none'; fit(); render(); });
$('q').addEventListener('input', e => { q = e.target.value; panel(); });
fit(); render();
})();
</script>
</body>
